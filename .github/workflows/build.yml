name: Build & Release

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze-and-test:
    name: Analyze & test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.27.4
          channel: stable
          cache: true
      - name: Generate platform folders (android + web)
        run: flutter create --platforms android,web .
      - name: Overlay custom Android widget code
        run: |
          rm -rf android/app/src/main/kotlin/com
          rm -f android/app/build.gradle.kts
          cp -r platform_overlay/android/. android/
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Run tests
        run: flutter test

  build-apk:
    name: Android APK
    needs: analyze-and-test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.27.4
          channel: stable
          cache: true
      - name: Generate platform folder (android)
        run: flutter create --platforms android .
      - name: Overlay custom Android widget code
        run: |
          rm -rf android/app/src/main/kotlin/com
          rm -f android/app/build.gradle.kts
          cp -r platform_overlay/android/. android/
      - name: Install dependencies
        run: flutter pub get
      - name: Generate launcher icons & splash
        run: |
          dart run flutter_launcher_icons
          dart run flutter_native_splash:create
      - name: Build APK (release)
        run: flutter build apk --release
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: StockPulse-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  build-windows:
    name: Windows desktop
    needs: analyze-and-test
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.27.4
          channel: stable
          cache: true
      - name: Generate platform folder (windows)
        run: flutter create --platforms windows .
      - name: Ensure Visual Studio C++ toolchain (2026 runner images ship VS 18+)
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $matched = ''
          if (Test-Path $vswhere) {
            $versions = & $vswhere -latest -all -products * `
              -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
              -format value -property installationVersion
            foreach ($v in $versions) {
              try {
                $major = ([version]"$v").Major
                if ($major -ge 14 -and $major -le 17) { $matched = $v; break }
              } catch { }
            }
          }
          if ($matched) {
            Write-Host "MSVC toolchain supported by Flutter 3.27 found (version $matched)"
          } else {
            Write-Host 'No Visual Studio 16/17 with C++ tools detected - installing VS 2022 Build Tools via Chocolatey'
            choco install visualstudio2022buildtools visualstudio2022-workload-vctools `
              -y --no-progress --ignore-package-exit-codes
          }
      - name: Install dependencies
        run: flutter pub get
      - name: Build Windows (release)
        run: flutter build windows --release
      - name: Zip build
        shell: pwsh
        run: |
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath StockPulse-windows.zip
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: StockPulse-windows
          path: StockPulse-windows.zip
          if-no-files-found: error

  build-web:
    name: Flutter web
    needs: analyze-and-test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.27.4
          channel: stable
          cache: true
      - name: Generate platform folder (web)
        run: flutter create --platforms web .
      - name: Install dependencies
        run: flutter pub get
      - name: Build web (release)
        run: flutter build web --release
      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: StockPulse-web
          path: build/web
          if-no-files-found: error

  release:
    name: Publish release (on tags)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-apk, build-windows, build-web]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Zip web build
        shell: bash
        run: |
          (cd artifacts/StockPulse-web && zip -qr ../StockPulse-web.zip .)
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/StockPulse-android-apk/*
            artifacts/StockPulse-windows/*
            artifacts/StockPulse-web.zip