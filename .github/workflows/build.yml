name: Build & Release

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze-and-test:
    name: Analyze & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.27.4
          channel: stable
          cache: true
      - name: Generate platform folders (android + web)
        run: flutter create --platforms android,web .
      - name: Overlay custom Android widget code
        run: |
          rm -rf android/app/src/main/kotlin/com
          rm -f android/app/build.gradle.kts
          cp -r platform_overlay/android/. android/
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Run tests
        run: flutter test

  build-apk:
    name: Android APK
    needs: analyze-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.27.4
          channel: stable
          cache: true
      - name: Generate platform folder (android)
        run: flutter create --platforms android .
      - name: Overlay custom Android widget code
        run: |
          rm -rf android/app/src/main/kotlin/com
          rm -f android/app/build.gradle.kts
          cp -r platform_overlay/android/. android/
      - name: Install dependencies
        run: flutter pub get
      - name: Build APK (release)
        run: flutter build apk --release
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: StockPulse-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  build-windows:
    name: Windows desktop
    needs: analyze-and-test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.27.4
          channel: stable
          cache: true
      - name: Generate platform folder (windows)
        run: flutter create --platforms windows .
      - name: Ensure Visual Studio C++ toolchain (2026 runner images ship VS 18+)
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $found = ''
          if (Test-Path $vswhere) {
            $found = & $vswhere -latest -all -products * `
              -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
              -property installationPath
          }
          if ($found) {
            Write-Host "Visual Studio C++ toolchain found at: $found"
          } else {
            Write-Host 'No MSVC toolchain detected - installing VS2022 Build Tools via Chocolatey'
            choco install visualstudio2022buildtools visualstudio2022-workload-vctools `
              -y --no-progress --ignore-package-exit-codes
          }
      - name: Install dependencies
        run: flutter pub get
      - name: Build Windows (release)
        run: flutter build windows --release
      - name: Zip build
        shell: pwsh
        run: |
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath StockPulse-windows.zip
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: StockPulse-windows
          path: StockPulse-windows.zip
          if-no-files-found: error

  release:
    name: Publish release (on tags)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-apk, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/StockPulse-android-apk/*
            artifacts/StockPulse-windows/*