name: Screenshots

# Runs the app on an Android emulator, drives through every tab and commits
# screenshots to docs/screenshots for the README. Does not gate other builds.
on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 1 * *' # monthly

permissions:
  contents: write

jobs:
  screenshots:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.27.4
          channel: stable
          cache: true
      - name: Generate platform folders
        run: flutter create --platforms android,web .
      - name: Overlay custom Android widget code
        run: |
          rm -rf android/app/src/main/kotlin/com
          rm -f android/app/build.gradle.kts
          cp -r platform_overlay/android/. android/
      - name: Install dependencies
        run: flutter pub get
      - name: Generate launcher icons
        run: dart run flutter_launcher_icons
      - name: Capture screenshots on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          script: |
            flutter drive \
              --driver=test_driver/integration_test.dart \
              --target=integration_test/screenshots_test.dart \
              -d emulator-5554 \
              --screenshot=docs/screenshots
      - name: Commit screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots
          if git diff --cached --quiet; then
            echo "No screenshot changes"
          else
            git commit -m "Update README screenshots [skip ci]"
            git push
          fi