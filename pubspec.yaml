name: stock_pulse
description: >-
  Stock Pulse - a free, open-source portfolio & dividend tracker for
  Android (APK + home-screen widgets) and Windows desktop.
publish_to: 'none'
version: 1.5.5+14

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  provider: ^6.1.2

  # Biometric lock (fingerprint / Windows Hello)
  local_auth: ^2.3.0

  # Web persistence (localStorage)
  shared_preferences: ^2.3.3

  # Networking (Yahoo Finance - no API key required)
  http: ^1.2.2

  # Number/date formatting
  intl: ^0.19.0

  # Local persistence (JSON files)
  path_provider: ^2.1.5

  # Android home-screen widgets
  home_widget: ^0.7.0
  google_mobile_ads: ^5.3.1

  # Charts
  fl_chart: ^0.69.2

  # File import/export
  file_selector: ^1.0.3
  share_plus: ^10.1.2
  url_launcher: ^6.3.1

  # Visual polish: shimmer skeletons for loading states
  shimmer: ^3.0.0

  # Material motion transitions (SharedAxis, FadeThrough, etc.)
  animations: ^2.0.11

  # Easy declarative animations
  flutter_animate: ^4.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  integration_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.4

flutter:
  uses-material-design: true
  assets:
    - assets/icon/app_icon_foreground.png
    # The privacy policy is shown inside the app and published with the web
    # build. One file, so it cannot drift.
    - PRIVACY.md

flutter_launcher_icons:
  image_path: assets/icon/app_icon.png
  android: true
  ios: false
  adaptive_icon_background: '#061D2B'
  adaptive_icon_foreground: assets/icon/app_icon_foreground.png
  adaptive_icon_monochrome: assets/icon/app_monochrome.png

flutter_native_splash:
  color: '#061D2B'
  image: assets/icon/app_icon_foreground.png
  android: true
  ios: false
  web: false
  android_12:
    color: '#061D2B'
    image: assets/icon/app_icon_foreground.png
